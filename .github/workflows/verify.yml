name: Validate remaster changes
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/ai-scout-frontier-tactics]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run verify
