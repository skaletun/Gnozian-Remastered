<!doctype html>
<html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Gnozian Remastered — Mobile layout QA</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#0b1720;color:#e6eff1;font-family:system-ui,sans-serif}
header{position:sticky;top:0;z-index:4;background:#132c36;border-bottom:1px solid #7b958a55;padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:9px}
h1{margin:0 18px 0 0;font-size:15px;color:#f4d7a2}button{padding:9px 14px;border:1px solid #9f9d75;border-radius:9px;background:#294b56;color:white;font-weight:700;cursor:pointer}button[aria-pressed=true]{background:#a47d46;color:#fff1cf}
p{margin:2px;font-size:11px;color:#bfd0d0}.view{display:flex;justify-content:center;padding:18px;min-height:calc(100vh - 80px)}.shell{box-shadow:0 20px 40px #000a;border:5px solid #2e505a;border-radius:22px;overflow:hidden;background:#07121a;max-width:100%}iframe{width:100%;height:100%;display:block;border:0;background:#081624}
</style></head><body>
<header><h1>GNOZIAN · MOBILE QA</h1><button data-w="390" data-h="844" aria-pressed="true">390 × 844</button>
<button data-w="360" data-h="740" aria-pressed="false">360 × 740</button>
<button data-w="844" data-h="390" aria-pressed="false">844 × 390</button>
<button data-w="768" data-h="1024" aria-pressed="false">768 × 1024</button>
<p>Вложенный экран создаёт отдельный CSS viewport. Проверка жестов требует настоящего сенсорного устройства.</p></header>
<div class="view"><div class="shell" id="shell" style="width:390px;height:844px"><iframe
title="Gnozian Remastered mobile game" src="./" loading="eager" allow="fullscreen"></iframe></div></div>
<script>
document.querySelectorAll('button[data-w]').forEach(button=>button.addEventListener('click',()=>{
  document.querySelectorAll('button[data-w]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));
  const shell=document.getElementById('shell');
  shell.style.width=button.dataset.w+'px';shell.style.height=button.dataset.h+'px';
}));
</script></body></html>
